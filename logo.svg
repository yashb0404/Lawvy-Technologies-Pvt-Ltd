<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 252" role="img" aria-label="Lawvy Technologies">
  <title>Lawvy Technologies</title>
  <defs>
    <linearGradient id="lv-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7E6C2"/>
      <stop offset="1" stop-color="#E3C489"/>
    </linearGradient>
  </defs>

  <!-- shield -->
  <path d="M13 13 H187 V133 C187 189 151 223 100 242 C49 223 13 189 13 133 Z"
        fill="#A80E1E" stroke="url(#lv-gold)" stroke-width="8" stroke-linejoin="round"/>

  <!-- wordmark -->
  <text x="100" y="92" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif" font-size="47" letter-spacing="2"
        fill="url(#lv-gold)">LAWVY</text>

  <!-- divider -->
  <g fill="none" stroke="url(#lv-gold)" stroke-width="3.4" stroke-linecap="round">
    <line x1="44" y1="113" x2="88" y2="113"/>
    <line x1="112" y1="113" x2="156" y2="113"/>
  </g>
  <circle cx="100" cy="113" r="4.6" fill="url(#lv-gold)"/>

  <!-- ionic capital: abacus + volutes -->
  <g fill="none" stroke="url(#lv-gold)" stroke-width="7" stroke-linecap="round">
    <path d="M64 140 H136 A10 10 0 0 1 136 150"/>
    <path d="M64 140 A10 10 0 0 0 64 150"/>
    <!-- volute scrolls -->
    <path d="M64 150 A14 14 0 1 0 78 164"/>
    <path d="M136 150 A14 14 0 1 1 122 164"/>
    <!-- necking -->
    <line x1="78" y1="157" x2="122" y2="157"/>
  </g>
  <circle cx="66" cy="160" r="4" fill="url(#lv-gold)"/>
  <circle cx="134" cy="160" r="4" fill="url(#lv-gold)"/>

  <!-- fluted shaft -->
  <g fill="url(#lv-gold)">
    <rect x="76"  y="168" width="7" height="62" rx="3.5"/>
    <rect x="88"  y="168" width="7" height="70" rx="3.5"/>
    <rect x="100" y="168" width="7" height="70" rx="3.5"/>
    <rect x="112" y="168" width="7" height="62" rx="3.5"/>
  </g>
</svg>
